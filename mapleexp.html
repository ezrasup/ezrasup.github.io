<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>網站已移站</title>

  <!-- ✅ 0 秒自動跳轉（想讓它停 3 秒再跳，把 content 改成 3;url=...） -->
  <meta http-equiv="refresh" content="0;url=https://30325129-lang.github.io/" />

  <style>
    body{
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans TC","Microsoft JhengHei",sans-serif;
      margin:0; padding:24px; line-height:1.6;
      background:#f9fafb;
    }
    .card{
      max-width:720px; margin:10vh auto 0;
      background:#fff; border:1px solid #e5e7eb;
      border-radius:16px; padding:18px 18px 14px;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
    }
    h1{ margin:0 0 8px; font-size:20px; }
    p{ margin:8px 0; color:#111827; }
    a{
      display:inline-block;
      margin-top:8px;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid #111827;
      text-decoration:none;
      color:#fff;
      background:#111827;
    }
    a:hover{ opacity:.92; }
    .muted{ color:#6b7280; font-size:13px; margin-top:10px; }
    .mono{ font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace; }
  </style>

  <script>
    // ✅ JS 也做一次跳轉備援（有些環境 meta refresh 會被擋）
    const target = "https://30325129-lang.github.io/";
    try{
      setTimeout(()=>location.replace(target), 50);
    }catch(e){}
  </script>
</head>
<body>
  <div class="card">
    <h1>網站已移至新網址</h1>
    <p>本網站已搬家，請前往新的網址：</p>

    <p class="mono">https://30325129-lang.github.io/</p>

    <a href="https://30325129-lang.github.io/" rel="noopener">點我前往新網站</a>

    <div class="muted">若未自動跳轉，請點上方按鈕。</div>
  </div>
</body>
</html>
